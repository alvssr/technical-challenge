services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering_postgres
    restart: always
    environment:
      POSTGRES_DB: wagering_db
      POSTGRES_USER: wagering_user
      POSTGRES_PASSWORD: wagering_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wagering_user -d wagering_db']
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.8.0
    container_name: wagering_localstack
    ports:
      - '4566:4566'
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:4566/_localstack/health >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wagering_processor
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-local-only-change-this-token-before-sharing}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: wagering_user
      DB_PASSWORD: wagering_pass
      DB_NAME: wagering_db
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      SQS_WAGERS_QUEUE_URL: http://localstack:4566/000000000000/wagers-queue
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          'fetch("http://localhost:3000/health/ready").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  localstack_data: